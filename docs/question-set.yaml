# The bilingual scorecard: 13 English and 13 Arabic questions, shuffled.
# An Arabic question is answered in Arabic only, an English one in English only;
# identifiers, citations, table names and EUR are neutral. Every figure is ground
# truth from the generator (src/new_horizons/app/ingest/validation/expected-results.json,
# pinned by tests/test_validation.py).
#   intent      the known question it should match (null = off-script, the free agent answers)
#   follows     asked on that question's thread
#   cite        the KB section the answer must cite ("file.md §n")
# Run: uv run python scripts/question-bank.py --set docs/question-set.yaml [--model llama3.1:8b]

- id: S01
  lang: en
  screen: Overview
  intent: farm_overview
  q: How many grow units and fish does the farm run?
  a: 4 grow units (AQ-01 pepper, AQ-02 lettuce, AQ-03 tomato, AQ-04 basil), 97 European perch, 83.0 m² of grow beds.
  must_include: ["4", "97", "83.0"]
  cite: data-dictionary.md §1

- id: S02
  lang: ar
  screen: Reconcile
  intent: pump_failure_loss
  q: كم كيلوغراماً خسرت الوحدة AQ-03 في الأسبوع التالي لتعطل المضخة، وماذا تقول إجراءات الصيانة عن زمن الاستجابة المطلوب؟
  a: خسرت الوحدة AQ-03 مقدار 9.80 كغ (حصاد 20 تموز 6.31 كغ مقابل 16.11 كغ في العادة)؛ تنص الإجراءات على الاستجابة خلال ساعتين، وانتظر التنبيه 113.2 ساعة.
  must_include: ["9.80", "113.2"]
  cite: pump-maintenance-sop.md §3

- id: S03
  lang: en
  screen: Reconcile
  intent: pump_failure
  q: Which unit had the pump failure, and when?
  a: AQ-03, 12–17 July — 555 water-pump runs commanded with no level rise; alert AL-2026-0001, repair work order 113.2 hours later.
  must_include: ["555", "113.2"]
  cite: pump-maintenance-sop.md §4

- id: S04
  lang: en
  screen: Reconcile
  intent: pump_failure_loss
  follows: S03
  q: And how many kilograms did that cost us?
  a: "9.80 kg of tomato in the week after (6.31 kg against 16.11 kg usual), 35.28 EUR; the SOP's response time is 2 hours."
  must_include: ["9.80"]
  cite: pump-maintenance-sop.md §3

- id: S05    # colloquial
  lang: ar
  screen: Overview
  intent: open_alerts
  q: في إنذارات مفتوحة هلّق بالمزرعة؟
  a: لا يوجد أي تنبيه مفتوح الآن (0)؛ صدر 16 تنبيهاً في الفترة، وتأخرت الاستجابة لتنبيه واحد (AL-2026-0001، 113.2 ساعة).
  must_include: ["16"]
  cite: alert-escalation.md §2

- id: S06    # colloquial
  lang: en
  screen: Reconcile
  intent: recon_exposure
  q: How much money is sitting in unresolved reconciliation right now?
  a: 220.89 EUR and 48.63 kg across 8 exceptions — harvests never shipped 171.72, pump commanded with no level rise 35.28, feed consumed but never bought 13.89.
  must_include: ["220.89"]
  cite: data-dictionary.md §7

- id: S07
  lang: ar
  screen: Patterns
  intent: ghost_harvests
  q: أي عمليات حصاد لم تُشحن أبداً ومن سجّلها؟
  a: 6 عمليات حصاد (31.52 كغ، 171.72 يورو) سجّلها كلها الفني TEC-06 دون توقيع ثانٍ ولم تُشحن.
  must_include: ["6", "31.52"]
  cite: harvest-shipping-procedure.md §2

- id: S08
  lang: en
  screen: Reconcile
  intent: unmetered_feed
  q: Was any feed used that we never bought?
  a: Yes — AQ-02 was fed 7.308 kg of FEED-03 on 29 days in August with no purchase behind it, 13.89 EUR at list price.
  must_include: ["7.308", "13.89"]
  cite: supplier-invoice-controls.md §4

- id: S09
  lang: en
  screen: Reconcile
  intent: feed_biosecurity
  follows: S08
  q: Is that a biosecurity problem?
  a: Yes — only feed from an approved supplier through a recorded purchase may enter a unit; quarantine the bag, stop feeding it, inform the owner.
  must_include: []
  cite: biosecurity-rules.md §3

- id: S10    # colloquial
