  screen: Drift
  intent: heatwave_aeration
  q: قديش اشتغلت مضخة الهوا بوحدة الطماطم وقت موجة الحر؟
  a: "عملت مضخة الهواء في AQ-03 بنسبة 60.4% من اليوم خلال موجة الحر مقابل 26.6% في حزيران، فوق حد 50% في 5 أيام."
  must_include: ["60.4", "26.6"]
  cite: pump-maintenance-sop.md §5

- id: S11
  lang: en
  screen: Drift
  intent: ph_drift_cause
  q: Is the pH drift on AQ-04 a sensor problem or a chemistry problem?
  a: A sensor problem — the lab measured pH 6.89 while the probe read 7.28; the decline between doses was unchanged; calibration on 21 August stepped it back.
  must_include: ["6.89", "7.28"]
  cite: sensor-calibration.md §3

- id: S12
  lang: ar
  screen: Patterns
  intent: sensor_dropouts
  q: هل حدثت انقطاعات في الحساسات وهل تغيّر نتائج الانحراف؟
  a: انقطاعان (AQ-02 في 13 حزيران 9 ساعات، AQ-04 في 6 آب 5 ساعات)؛ فجوات لا أصفار، فلم يرفع أي منهما إنذار انحراف.
  must_include: ["9", "5"]
  cite: sensor-calibration.md §4

