[project]
name = "new-horizons"
version = "0.1.0"
description = "Offline analytics agent for an aquaponics farm (Streamlit + LangGraph), and the shared agent harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar Soman" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # LLM / agents
    "openai>=1.40",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "pydantic>=2.8",
    # data + analytics
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "faker>=28",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "plotly>=5.22",
    # documents / KB
    "pymupdf>=1.24",
    "surya-ocr>=0.8",
    "transformers>=4.53,<5",   # surya 0.17 breaks on transformers 5.x
    "pytesseract>=0.3.13",
    "pillow>=10",
    "chromadb>=0.5",
    # app + infra
    "streamlit>=1.38",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
reranker = ["sentence-transformers>=3.0"]

[project.urls]
Repository = "https://github.com/omarsoman/new-horizons"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/new_horizons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "domain: needs the farm data, analytics and knowledge base (make mock kb)",
    "model: calls a live chat model through Ollama (skipped in CI)",
]
# Phase 1 runs the harness tests only; phase 2 lands the farm data and drops this.
addopts = "-m 'not domain'"

[tool.importlinter]
root_package = "new_horizons"

[[tool.importlinter.contracts]]
name = "shared never imports the app or the host"
type = "forbidden"
source_modules = ["new_horizons.shared"]
forbidden_modules = ["new_horizons.app", "new_horizons.host"]

[[tool.importlinter.contracts]]
name = "views never import each other"
type = "independence"
modules = [
    "new_horizons.app.views.overview",
    "new_horizons.app.views.reconcile",
    "new_horizons.app.views.drift",
    "new_horizons.app.views.patterns",
    "new_horizons.app.views.documents",
    "new_horizons.app.views.chat",
    "new_horizons.app.views.changes",
    "new_horizons.app.views.admin",
    "new_horizons.app.views.settings",
]
