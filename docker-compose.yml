# new-horizons standalone: Postgres only. Chroma is embedded (data/kb/chroma).
# Ollama runs on the host; containers reach it at host.docker.internal:11434.
# Sojourner's stack runs this same container and volume (one audit chain):
# its tier-2 and staging containers join `horizons-db`, an INTERNAL network, so they
# reach Postgres without gaining a route anywhere else.
services:
  postgres:
    image: postgres:16
    container_name: horizons-postgres
    environment:
      POSTGRES_USER: horizons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizons}
      POSTGRES_DB: horizons
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/new_horizons/shared/db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [default, farm-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizons"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  farm-db:
    name: horizons-db
    internal: true

volumes:
  pgdata:
    name: horizons-pgdata
