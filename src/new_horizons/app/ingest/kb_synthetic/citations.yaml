# Citation registry — the contract between the KB corpus, the analytics and the
# document-intake alert. Code cites by KEY; tests assert that every entry's
# `source` + `section` exists in the indexed KB and that the section text
# contains every `must_contain` term. Section numbers come from the doc
# headings ("## 4. …", "### 3.1 …").

