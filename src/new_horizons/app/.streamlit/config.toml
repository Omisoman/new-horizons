# Agentization Core theme — mirrors design/tokens.json (tests/test_ui.py
# asserts they agree). Hand-maintained; no longer generated by brand-sync.

[theme]
base = "dark"
primaryColor = "#ffffff"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
textColor = "#ffffff"
borderColor = "#1f1f1f"
linkColor = "#ffffff"
font = "Inter Variable, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif"
headingFont = "Inter Variable, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue, Arial, sans-serif"
codeFont = "ui-monospace, SF Mono, Menlo, Consolas, monospace"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["28px", "20px", "16px", "15px", "14px", "13px"]
metricValueFontSize = "28px"
metricValueFontWeight = 600
baseRadius = "8px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#1f1f1f"
dataframeHeaderBackgroundColor = "#0a0a0a"
chartCategoricalColors = ["#b8893a", "#3987e5", "#199e70"]
redColor = "#ef4444"
greenColor = "#0ca30c"

[[theme.fontFaces]]
family = "Inter Variable"
url = "app/static/InterVariable.woff2"
weight = "100 900"
style = "normal"

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#0a0a0a"
borderColor = "#1f1f1f"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
enableStaticServing = true
maxUploadSize = 50
